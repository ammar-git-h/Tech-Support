<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-lightblue">
    <header class="bg-graygradient text-white py-4 text-center">
            <nav class="navbar navbar-expand-lg">
                <div class="container align-items-start align-items-lg-center">
                    <a class="navbar-brand h2 fw-bold text-white d-flex align-items-center me-0" href="index.html">
                        <img src="tkhlogo.png" alt="The Knowledge Hub" class="me-1" height="50" >
                        <span class="text-wrap">Campus Tech Support Ticketing</span>
                    </a>
                    
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navBar">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navBar">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item"><a class="nav-link active text-white" href="index.html"><i class="bi bi-house"></i> Home</a></li>
                            <li class="nav-item"><a class="nav-link text-white" href="ticketform.html"><i class="bi bi-ticket"></i> <strong> Submit Ticket (You are here)</strong></a></li>
                            <li class="nav-item"><a class="nav-link text-white" href="ticketstatus.html"><i class="bi bi-check-circle"></i> Ticket Status</a></li>
                            <li class="nav-item"><a class="nav-link text-white" href="dashboard.html"><i class="bi bi-database"></i>IT Dashboard</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
    </header>

    <main class="container my-4 py-5">
        <div class="row g-3">
            <article class="col-sm-12 col-md-12 col-lg-12 mb-2">
                <div class="card h-100 bg-whitegradient shadow-lg">
                    <div class="card-body">
                        <h1 class="card-title text-center"><i class="bi bi-ticket"></i> Ticket Submission Form</h1>
                        <h5 class="card-text text-center">Fill out each field to submit your ticket</h5>
                    </div>
                </div>
            </article>
            <article class="col-sm-12 col-md-12 col-lg-12 mb-2">
                <div class="card h-100 bg-whitegradient shadow-lg">
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="name" class="form-label fs-3">Your Coventry ID</label>
                                <input type="text" class="form-control" id="covId" placeholder="Enter your Coventry ID" required>
                            </div>
                            <div class="mb-3">
                                <label for="location" class="form-label fs-3">Location of issue</label>
                                <select class="form-control mb-3" id="buildingNumber" required>
                                    <option value="" disabled selected>Select building</option>
                                    <option value="A">Building A</option>
                                    <option value="B">Building B</option>
                                    <option value="C">Building C</option>
                                    <option value="Eng">Engineering Building</option>
                                </select>
                                <input type="text" class="form-control" id="roomNumber" placeholder="Enter room number" required>
                            </div>
                            <div class="mb-3">
                                <label for="issueType" class="form-label fs-3">Type of issue</label>
                                <select class="form-control mb-3" id="issueType" required>
                                    <option value="" disabled selected>Select issue type</option>
                                    <option value="hardware">Hardware</option>
                                    <option value="software">Software</option>
                                    <option value="network">Network</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="priority" class="form-label fs-3">Urgency</label>
                                <select class="form-control mb-3" id="priority" required>
                                    <option value="" disabled selected>Select urgency</option>
                                    <option value="low">Low</option>
                                    <option value="medium">Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="department" class="form-label fs-3">Department</label>
                                <input type="text" class="form-control" id="department" placeholder="Enter your department" required>
                            </div>
                            <div class="mb-3">
                                <label for="deviceType" class="form-label fs-3">Device type</label>
                                <select class="form-control mb-3" id="deviceType" required>
                                    <option value="" disabled selected>Select device type</option>
                                    <option value="desktop">Desktop</option>
                                    <option value="laptop">Laptop</option>
                                    <option value="printer">Printer</option>
                                    <option value="projector">Projector</option>
                                    <option value="network">Network Device</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="deviceModel" class="form-label fs-3">Device model</label>
                                <input type="text" class="form-control" id="deviceModel" placeholder="Enter device model (if applicable)">
                            </div>
                            <div class="mb-3">
                                <label for="operatingSystem" class="form-label fs-3">Operating system</label>
                                <input type="text" class="form-control" id="operatingSystem" placeholder="Enter operating system (if applicable)">
                            </div>
                            <div class="mb-3">
                                <label for="issueDescription" class="form-label fs-3">Issue description</label>
                                <textarea class="form-control" id="issue" rows="4" placeholder="Describe the issue you are experiencing" required></textarea>
                            </div>
                            <button type="submit" class="btn bg-greengradient border-secondary w-100 h-100 fs-3" onclick="window.location.href='ticketstatus.html'"><i class="bi bi-pen"></i> Submit Ticket</button>
                        </form>
                    </div>
                </div>
        </div>
    </main>

    <footer class="bg-graygradient text-white py-4 text-center">
        <article>
            <div>
                <img src="tkh.png" alt="The Knowledge Hub" width="198.5" height="77.5" class="mb-3">
            </div>
            <div>
                <h5>Incase website is down, or if you are experiencing issues, visit the IT department for quick assistance.</h5>
            </div>
        </article>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
